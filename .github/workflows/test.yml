name: test

# Hermetic suites only — E2E_LIVE stays unset so nothing touches
# mainnet, real balances, or unmocked third parties. Live lanes are
# documented in TESTING.md and run manually. Sibling repos carry the
# same one-job pattern in their own .github/workflows/test.yml.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:all
