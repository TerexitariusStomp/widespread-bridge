<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widespread Watcher</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:12px 16px; border-bottom:1px solid #30363d; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  .pill { padding:2px 8px; border-radius:10px; border:1px solid #30363d; font-size:12px; color:var(--dim); }
  .pill.on { color:var(--ok); border-color:var(--ok); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:800px){ main{grid-template-columns:1fr;} }
  section { border:1px solid #30363d; border-radius:8px; padding:12px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--acc); text-transform:uppercase; letter-spacing:.05em; }
  button, input, select, textarea { background:#161b22; color:var(--fg); border:1px solid #30363d; border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#0d1117; border:none; font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .item { border-top:1px solid #21262d; padding:8px 0; font-size:13px; }
  .item .meta { color:var(--dim); font-size:11px; }
  .tier-lead { color:var(--warn); } .tier-corroborated { color:var(--ok); } .tier-disputed { color:var(--bad); }
  .decl { color:var(--acc); }
  .log { max-height:180px; overflow:auto; font-size:12px; color:var(--dim); white-space:pre-wrap; }
  label { font-size:12px; color:var(--dim); }
  textarea { width:100%; min-height:60px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Widespread Watcher</h1>
  <span class="pill" id="id-pill">no identity</span>
  <span class="pill" id="relay-pill">relays: —</span>
  <span class="pill" id="stat-pill">sightings: 0</span>
</header>
<main>
  <section>
    <h2>Identity</h2>
    <div id="id-new" class="row">
      <button class="primary" id="btn-gen">Generate keypair</button>
      <button id="btn-nip07">Use Nostr signer (NIP-07)</button>
      <span class="meta" style="color:var(--dim);font-size:12px">stored in this browser only — export to move devices</span>
    </div>
    <div id="id-have" class="hidden">
      <div class="row"><label>npub:</label><code id="npub" style="font-size:11px;word-break:break-all"></code></div>
      <div class="row"><label>nsec:</label><input id="nsec" readonly style="flex:1;font-size:11px"></div>
      <div class="row">
        <button id="btn-copy-nsec">Copy nsec</button>
        <button id="btn-export">Export state (encrypted)</button>
        <button id="btn-import">Import</button>
        <input type="file" id="file-import" class="hidden">
      </div>
      <div class="row"><label>passphrase:</label><input id="pass" type="password" placeholder="for export/import"></div>
      <div class="row"><textarea id="blob" placeholder="export blob appears here / paste import blob" readonly></textarea></div>
    </div>
  </section>

  <section>
    <h2>Watch surfaces</h2>
    <div id="surfaces"></div>
    <div class="row">
      <label>add surface:</label>
      <input id="new-platform" placeholder="platform e.g. discourse:forum.x" size="22">
      <input id="new-url" placeholder="poll URL (JSON or RSS)" size="30">
      <select id="new-kind"><option value="json">json</option><option value="rss">rss</option><option value="hn">hn-algolia</option></select>
      <button id="btn-add-surface">Add</button>
    </div>
    <div class="row">
      <label>grammar filter (regex, optional):</label>
      <input id="grammar" placeholder="default: widespread" size="40">
      <button id="btn-poll">Poll now</button>
      <label><input type="checkbox" id="auto"> auto-poll 60s</label>
      <button id="btn-wake">keep-awake</button>
    </div>
    <div class="log" id="watch-log"></div>
  </section>

  <section>
    <h2>Relay</h2>
    <div class="row">
      <input id="relays" value="wss://relay.snort.social,wss://relay.primal.net,wss://nostr.bitcoiner.social,wss://widespread-relay.widespread.workers.dev" style="flex:1">
      <button id="btn-connect">Connect</button>
      <button id="btn-sync-out">Publish state</button>
      <button id="btn-sync-in">Fetch state</button>
    </div>
    <div class="log" id="relay-log"></div>
  </section>

  <section>
    <h2>Discover</h2>
    <div class="row">
      <input id="q-platform" placeholder="platform" size="14">
      <input id="q-native" placeholder="native_id" size="14">
      <input id="q-text" placeholder="text contains" size="20">
      <button id="btn-query-local">Local index</button>
      <button id="btn-query-relay">Query relays</button>
    </div>
    <div id="results"></div>
  </section>

  <section>
    <h2>Feed (local projection)</h2>
    <div id="feed"></div>
  </section>

  <section>
    <h2>Capacity index (Ĉ)</h2>
    <div class="meta">declared dims parsed from sighting text — the public C(t) view</div>
    <div id="capacity"></div>
    <div class="row" style="margin-top:8px">
      <button id="btn-snapshot">Publish capacity snapshot</button>
      <span id="snapshot-log" class="meta"></span>
    </div>
  </section>
</main>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
<script src="nostr.bundle.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
