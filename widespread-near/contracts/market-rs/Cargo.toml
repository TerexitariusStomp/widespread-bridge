[package]
name = "widespread-market"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
near-workspaces = "0.24"
near-sdk = { version = "5", features = ["unit-testing"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
